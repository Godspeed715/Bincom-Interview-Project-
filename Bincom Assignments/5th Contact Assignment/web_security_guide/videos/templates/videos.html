{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos</title>
    <link rel="stylesheet" href="{% static 'home/style.css' %}">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="nav-container">
        <div class="logo">
            <a href="/">Web Security Guide</a>
        </div>

        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/owasp/{{video.page_no}}">OWASP</a></li>
            <li><a href="/videos/1">Videos</a></li>
        </ul>
    </div>
</nav>

<div class="container">

    <h1 class="title">{{video.title}}</h1>
    <div class="video-grid">

        {% if video %}
            <div class="video-card">
                <div class="video-wrapper">
                    <iframe width="560" height="315" src="{{video.src}}" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                </div>
                <h3>{{ video.title }}</h3>
            </div>
        {% else %}
            <p>No videos available</p>
        {% endif %}

    </div>

    <!-- Navigation -->

        <nav class="nav-buttons">
        {% if prev_id %}
            <a href="{% url 'videos' prev_id %}" class="btn prev">
                ← Previous
            </a>
        {% endif %}

        {% if next_id %}
            <a href="{% url 'videos' next_id %}" class="btn next">
                Next →
            </a>
        {% endif %}
        </nav>

        <!-- Footer -->
        <footer>
            <p>OWASP Top 10 2025 | Security Awareness Project</p>
        </footer>

</div>

</body>
</html>
